name: e2e

# Runs the shared Playwright journeys (RetailerCustomerPlatform/e2e) against this PR's code.
# The suite, seed and stack setup live in RetailerCustomerPlatform; this file only passes our ref.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  e2e:
    uses: vin8003/RetailerCustomerPlatform/.github/workflows/e2e.yml@f98c35750e56147abbde9b814481b416076b151f
    with:
      area: customer
      rcp_ref: f98c35750e56147abbde9b814481b416076b151f
      customer_ref: ${{ github.event.pull_request.head.sha || github.sha }}
    secrets:
      E2E_REPO_TOKEN: ${{ secrets.E2E_REPO_TOKEN }}
